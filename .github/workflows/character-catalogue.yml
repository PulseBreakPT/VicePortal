name: Character catalogue verification
on:
  pull_request:
    paths:
      - 'frontend/src/data/**'
      - 'frontend/public/images/**'
      - 'frontend/scripts/verify-character-catalogue.mjs'
      - '.github/workflows/character-catalogue.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/data/**'
      - 'frontend/public/images/**'
      - 'frontend/scripts/verify-character-catalogue.mjs'
      - '.github/workflows/character-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node frontend/scripts/verify-character-catalogue.mjs
