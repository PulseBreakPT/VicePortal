name: Publish Vice Atlas
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vice-atlas-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: /VicePortal
      GENERATE_SOURCEMAP: 'false'
      CI: 'false'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        run: yarn install --non-interactive --network-timeout 120000
      - name: Download and validate GTA Town creator datasets
        run: node scripts/import-creator-data.mjs
      - name: Verify Universal Data Engine
        run: node scripts/verify-universal-data.mjs
      - name: Verify creator dataset integration
        run: node scripts/verify-creator-data.mjs
      - name: Verify cinematic motion bounds and integration
        run: node scripts/verify-cinematic.mjs
      - name: Verify Neon Cipher reveal
        run: node scripts/verify-neon-cipher.mjs
      - name: Verify smooth motion system
        run: node scripts/verify-smooth.mjs
      - name: Verify cinematic catalogue organization
        run: node scripts/verify-catalogue.mjs
      - name: Verify site-only UI controls
        run: node scripts/verify-site-ui.mjs
      - name: Verify unique landing and shared page content
        run: node scripts/verify-page-ownership.mjs
      - name: Verify unique dossier presentation
        run: node scripts/verify-dossier-dedup.mjs
      - name: Verify character catalogue
        run: node scripts/verify-character-catalogue.mjs
      - name: Import full public vehicle catalogue (retain reviewed snapshot if unavailable)
        continue-on-error: true
        run: node scripts/import-vehicles.mjs
      - name: Verify vehicle catalogue
        run: node scripts/verify-vehicles.mjs
      - name: Verify cinematic performance instruments
        run: node scripts/verify-performance.mjs
      - name: Audit every universal dossier and spoiler state
        run: node scripts/verify-universal-dossiers.mjs
      - name: Audit vehicle image availability and duplicate bytes
        run: node scripts/audit-vehicle-images.mjs
      - name: Upload vehicle image audit and snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-image-snapshot
          path: |
            frontend/src/data/vehicleImageRefs.json
            frontend/src/data/vehicleImageMissing.json
            frontend/src/data/vehicleImageAudit.json
            frontend/src/data/universalAudit.json
            frontend/src/data/creatorData.json
            frontend/src/data/vehicleFeed.json
          if-no-files-found: error
      - name: Build original React frontend
        run: yarn build
      - name: Prepare project-relative assets and route fallback
        run: node scripts/prepare-pages.mjs
      - name: Stamp and validate deployable artifact
        run: node scripts/stamp-pages-build.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: frontend/build

  deploy:
    # Only the trusted main ref can publish the artifact.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact build artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the public release and deep-link fallback
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node frontend/scripts/verify-live-pages.mjs
