name: Publish Vice Atlas
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/publish-pages.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vice-atlas-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: /VicePortal
      GENERATE_SOURCEMAP: 'false'
      CI: 'false'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        run: yarn install --non-interactive --network-timeout 120000
      - name: Download and validate GTA Town creator datasets
        run: node scripts/import-creator-data.mjs
      - name: Verify Universal Data Engine
        run: node scripts/verify-universal-data.mjs
      - name: Verify creator dataset integration
        run: node scripts/verify-creator-data.mjs
      - name: Verify cinematic motion bounds and integration
        run: node scripts/verify-cinematic.mjs
      - name: Verify Neon Cipher reveal
        run: node scripts/verify-neon-cipher.mjs
      - name: Verify smooth motion system
        run: node scripts/verify-smooth.mjs
      - name: Verify cinematic catalogue organization
        run: node scripts/verify-catalogue.mjs
      - name: Verify site-only UI controls
        run: node scripts/verify-site-ui.mjs
      - name: Verify unique dossier presentation
        run: node scripts/verify-dossier-dedup.mjs
      - name: Verify character catalogue
        run: node scripts/verify-character-catalogue.mjs
      - name: Import full public vehicle catalogue (retain reviewed snapshot if unavailable)
        continue-on-error: true
        run: node scripts/import-vehicles.mjs
      - name: Verify vehicle catalogue
        run: node scripts/verify-vehicles.mjs
      - name: Audit vehicle image availability and duplicate bytes
        run: node scripts/audit-vehicle-images.mjs
      - name: Upload vehicle image audit and snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-image-snapshot
          path: |
            frontend/src/data/vehicleImageRefs.json
            frontend/src/data/vehicleImageMissing.json
            frontend/src/data/vehicleImageAudit.json
            frontend/src/data/universalAudit.json
            frontend/src/data/creatorData.json
            frontend/src/data/vehicleFeed.json
          if-no-files-found: error
      - name: Build original React frontend
        run: yarn build
      - name: Prepare project-relative assets and route fallback
        run: node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: frontend/build

  deploy:
    # Production is published from main / (root) by GitHub Pages.
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  persist-vehicle-images:
    if: ${{ false }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: vehicle-image-snapshot
          path: snapshot
      - name: Persist validated reference snapshot without stale overwrites
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BUILD_SHA" ]; then
            echo "Main changed during build; skipping stale snapshot."
            exit 0
          fi
          git checkout --detach "$BUILD_SHA"
          cp snapshot/vehicleImageRefs.json frontend/src/data/vehicleImageRefs.json
          cp snapshot/vehicleImageMissing.json frontend/src/data/vehicleImageMissing.json
          cp snapshot/creatorData.json frontend/src/data/creatorData.json
          cp snapshot/vehicleFeed.json frontend/src/data/vehicleFeed.json
          git add frontend/src/data/vehicleImageRefs.json frontend/src/data/vehicleImageMissing.json frontend/src/data/creatorData.json frontend/src/data/vehicleFeed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist validated creator datasets and vehicle image references"
          git push origin HEAD:main
